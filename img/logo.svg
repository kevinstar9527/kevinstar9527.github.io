<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#starGradient)" opacity="0.1"/>
  
  <!-- Smart star shape -->
  <path d="M256 80 L300 180 L410 195 L330 270 L350 380 L256 330 L162 380 L182 270 L102 195 L212 180 Z" 
        fill="url(#starGradient)" 
        stroke="white" 
        stroke-width="4"/>
  
  <!-- Inner sparkle effects -->
  <circle cx="256" cy="220" r="12" fill="white" opacity="0.9"/>
  <circle cx="220" cy="260" r="8" fill="white" opacity="0.7"/>
  <circle cx="290" cy="260" r="8" fill="white" opacity="0.7"/>
  
  <!-- AI/Smart circuit lines -->
  <path d="M256 220 L256 280 M220 260 L292 260" 
        stroke="white" 
        stroke-width="3" 
        stroke-linecap="round"
        opacity="0.6"/>
</svg>
